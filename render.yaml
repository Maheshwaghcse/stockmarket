services:
  - type: web
    name: stocksense-backend
    env: node
    rootDir: server
    buildCommand: npm install
    startCommand: node src/index.js
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MARKET_DATA_MODE
        value: yahoo
      - key: YAHOO_CACHE_TTL_SECONDS
        value: 30
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: COOKIE_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false
      - key: NEWS_API_KEY
        value: 93ba24a1a3094d50ae21e8cb82c79bb4
